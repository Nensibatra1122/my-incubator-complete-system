name: Auto Deploy to Ubuntu EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Build Frontend
        working-directory: Frontend
        run: |
          npm install
          npm run build

      - name: Deploy to Nginx Directory
        run: |
          sudo cp -r Frontend/dist/* /var/www/html/
          sudo systemctl restart nginx